server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: unknown paths (/patient, /caregiver ...) must return index.html
  location / {
    try_files $uri /index.html;
  }

  # Service worker must never be cached, or PWA updates get stuck
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
}