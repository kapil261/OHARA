name: CI

# Runs on every Pull Request into main (and on main itself after a merge)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # No frontend tests are written yet, so don't fail on "no test files"
      - run: npx vitest run --passWithNoTests
      - run: npm run build

  backend:
    name: Backend (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-secret
      # Dummy URLs: the tests never touch a real database
      DATABASE_URL: postgresql://ohara:ohara@localhost:5432/ohara
      DIRECT_URL: postgresql://ohara:ohara@localhost:5432/ohara
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ai:
    name: AI service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [frontend, backend, ai]
    steps:
      - uses: actions/checkout@v4
      - run: cp devops-testing/.env.example devops-testing/.env
      - run: docker compose -f devops-testing/docker-compose.yml build